<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Space Invaders Arcade</title>
    <link rel="icon" type="image/png" href="assets/a1.png">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="lib/p5.js"></script>
    <script src="js/util.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/imgprimitive.js"></script>
    <script src="js/bomb.js"></script>
    <script src="js/bombs.js"></script>
    <script src="js/bunker.js"></script>
    <script src="js/bunkers.js"></script>
    <script src="js/explosion.js"></script>
    <script src="js/invader.js"></script>
    <script src="js/squadron.js"></script>
    <script src="js/invaders.js"></script>
    <script src="js/mystery.js"></script>
    <script src="js/lasercannon.js"></script>
    <script src="js/shot.js"></script>
    <script src="js/shots.js"></script>
    <script src="js/player.js"></script>
    <script src="js/revealer.js"></script>
    <script src="js/console.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
</head>

<body>
    <!-- Top Bar Navigation -->
    <div class="top-nav">
        <a href="https://stevemansour.com/games/">◀ Arcade</a>
        <span class="top-nav-tag">1978 SPACE INVADERS ARCADE</span>
    </div>

    <!-- Master Arcade Container: Left Cabinet Panel + Right Game Screen -->
    <div class="arcade-container">
        <!-- Left Side: Authentic Arcade Cabinet Graphic with Overlaid Controls -->
        <div class="arcade-side-panel">
            <img src="assets/cabinet_side_art.jpg" alt="Space Invaders Arcade Art" class="cabinet-side-bg">

            <!-- Controls Overlaid on the Lower Section of the Graphic -->
            <div class="arcade-overlay-controls">
                <div class="player-buttons-group">
                    <button id="btn-1p" class="arcade-btn-img" onclick="onePlayer()" title="1 Player Start">
                        <img src="assets/oneplayer.png" alt="1 PLAYER" class="btn-icon-img">
                    </button>
                    <button id="btn-2p" class="arcade-btn-img" onclick="twoPlayers()" title="2 Players Start">
                        <img src="assets/twoplayers.png" alt="2 PLAYERS" class="btn-icon-img">
                    </button>
                </div>

                <!-- Coin Button and Credit Readout (Vertically Centered in One Row) -->
                <div class="coin-credit-row">
                    <button id="btn-coin" class="arcade-coin-img-btn throb" onclick="coinInserted()"
                        title="Click to Insert 25¢ Quarter">
                        <img src="assets/insertCoin.png" alt="INSERT COIN TO PLAY" class="coin-icon-img">
                    </button>
                    <div class="level-counter credit-counter">
                        <div id="arcade-ticker" class="arcade-ticker-wrap">
                            <span class="arcade-ticker-text">WHAT LEVEL WILL YOU ACHIEVE? ★ CAN YOU SURVIVE TO LEVEL 7?
                                ★</span>
                        </div>
                        <span id="arcade-level-static" style="display: none;">LEVEL <span
                                id="arcade-level-count">01</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: The Game Screen -->
        <div class="arcade-game-panel">
            <div id="theCanvas"></div>
        </div>
    </div>
</body>

</html>
